apiVersion: v1
kind: Service
metadata:
  name: ingest-api
  namespace: opentelm
spec:
  type: ClusterIP
  selector:
    app: ingest-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# HPA — scale on CPU. We don't have custom Kafka-lag metrics yet (would
# need a Prometheus stack); CPU is a decent proxy under typical traffic.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingest-api
  namespace: opentelm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingest-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
