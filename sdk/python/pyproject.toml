[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentelm"
# Keep in sync with opentelm/_version.py (enforced by tests/test_packaging.py).
version = "0.2.0"
description = "Zero-config observability SDK for LLM apps. Auto-instruments OpenAI and Anthropic calls, sync, async and streaming."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohit Anakiya" }]
keywords = ["llm", "observability", "openai", "anthropic", "monitoring", "tracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
# No runtime dependencies: HTTP delivery uses the standard library, so the
# SDK can never conflict with the httpx / httpx2 version your LLM client pins.
dependencies = []

[project.optional-dependencies]
openai    = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]
test      = ["pytest>=8", "pytest-asyncio>=0.23", "openai>=1.0.0", "anthropic>=0.25.0", "tomli; python_version < '3.11'"]

[project.urls]
Homepage    = "https://github.com/rohitanakiya/OpentelLM"
Repository  = "https://github.com/rohitanakiya/OpentelLM"
Issues      = "https://github.com/rohitanakiya/OpentelLM/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["opentelm*"]
exclude = ["tests*", "bench*"]
