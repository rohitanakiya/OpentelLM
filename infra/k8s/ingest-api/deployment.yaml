apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-api
  namespace: opentelm
  labels:
    app: ingest-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Surge by 1 to keep capacity steady during deploys
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ingest-api
  template:
    metadata:
      labels:
        app: ingest-api
    spec:
      serviceAccountName: opentelm-app
      # Match the FastAPI graceful shutdown handler we wrote in Phase 1
      terminationGracePeriodSeconds: 60
      containers:
        - name: ingest-api
          image: REPLACE_AT_DEPLOY_TIME/ingest-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: opentelm-config }
            - secretRef:    { name: opentelm-secrets }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          # Run as non-root for Autopilot's PodSecurityStandard "restricted"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: false
