name: Publish Node SDK

# Tags shaped sdk-node-v* trigger a publish. Anything else is ignored.
# The tag's version SHOULD match package.json's version — npm publish
# will reject mismatched re-publishes anyway.
on:
  push:
    tags:
      - "sdk-node-v*"

permissions:
  contents: read
  id-token: write   # required for npm provenance attestation

concurrency:
  group: publish-node-sdk
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/nodejs } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/nodejs/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test (includes smoke tests of the built package)
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sdk/nodejs } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # registry-url makes npm publish use the npm token from $NODE_AUTH_TOKEN
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: sdk/nodejs/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify tag matches package.json version
        run: |
          PKG_VER="v$(node -p "require('./package.json').version")"
          TAG_VER="${GITHUB_REF_NAME#sdk-node-}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::tag $TAG_VER does not match package.json $PKG_VER"
            exit 1
          fi
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
