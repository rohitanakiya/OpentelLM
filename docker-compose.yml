# Local development stack. Start it with:  bash scripts/dev-up.sh
# (creates .env with random secrets on first run, then docker compose up)

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    # No host port: only other containers use this. Uncomment to reach it
    # from Windows/macOS tools (the port must be free on your machine).
    # ports:
    #   - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    # No host port: only other containers use this. Uncomment to reach it
    # from Windows/macOS tools (the port must be free on your machine).
    # ports:
    #   - "127.0.0.1:9000:9000"
    #   - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    environment:
      CLICKHOUSE_DB: opentelm
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    # No host port: only other containers use this. Uncomment to reach it
    # from Windows/macOS tools (the port must be free on your machine).
    # ports:
    #   - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: opentelm
      POSTGRES_PASSWORD: opentelm
      POSTGRES_DB: opentelm
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentelm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # No host port: only other containers use this. Uncomment to reach it
    # from Windows/macOS tools (the port must be free on your machine).
    # ports:
    #   - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingest-api:
    build: ./ingest-api
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_HOST: clickhouse
      POSTGRES_DSN: postgresql://opentelm:opentelm@postgres:5432/opentelm
      REDIS_URL: redis://redis:6379/0
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    ports:
      - "127.0.0.1:8001:8001"
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql://opentelm:opentelm@postgres:5432/opentelm
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  consumer:
    build: ./consumer
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_HOST: clickhouse
      POSTGRES_DSN: postgresql://opentelm:opentelm@postgres:5432/opentelm
      REDIS_URL: redis://redis:6379/0
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Creates the llm.requests and llm.anomalies topics with sane partition
  # counts. Kafka also has auto-create on, but explicit topics get the right
  # number of partitions and we don't depend on the broker default.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic llm.requests --partitions 6 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic llm.anomalies --partitions 3 --replication-factor 1"
    restart: "no"

  stream-processor:
    build: ./stream-processor
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_HOST: clickhouse
      REDIS_URL: redis://redis:6379/0
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "127.0.0.1:3000:3000"
      # 3001 is internal-only - Next rewrites proxy /api/ws/* to it.
    env_file: .env
    environment:
      NEXT_PUBLIC_APP_NAME: OpenTelLM
      AUTH_SERVICE_URL: http://auth-service:8001
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: opentelm
      REDIS_URL: redis://redis:6379
      # JWT_SECRET_KEY comes from .env (same value as auth-service, so the
      # dashboard verifies logins locally). scripts/dev-up.sh generates it.
      WS_INTERNAL_URL: http://localhost:3001
      # The local stack is plain http://localhost; Secure cookies would be
      # dropped by Safari there. Leave unset (secure) for any real deployment.
      COOKIE_SECURE: "false"
    depends_on:
      auth-service:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  anomaly-consumer:
    build: ./anomaly-consumer
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_HOST: clickhouse
      REDIS_URL: redis://redis:6379/0
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # End-to-end smoke test: `bash scripts/smoke-test.sh`. Only runs when asked
  # for (profile "smoke"); sends fake events, never calls a real LLM provider.
  smoke:
    image: python:3.12-slim
    profiles: ["smoke"]
    volumes:
      - ./scripts:/w/scripts:ro
      - ./sdk/python:/w/sdk/python:ro
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: ["python", "/w/scripts/smoke_test.py"]
    depends_on:
      ingest-api:
        condition: service_started
      dashboard:
        condition: service_started

volumes:
  clickhouse_data:
  postgres_data:


