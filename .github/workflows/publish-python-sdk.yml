name: Publish Python SDK

# Tags shaped sdk-py-v* trigger a PyPI publish. Use trusted publisher
# (PyPI's OIDC integration) so no API token sits in GitHub Secrets.
# Configure once at https://pypi.org/manage/account/publishing/
on:
  push:
    tags:
      - "sdk-py-v*"

permissions:
  contents: read
  id-token: write   # required for PyPI trusted publishing

concurrency:
  group: publish-python-sdk
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build deps + SDK in editable mode
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip build
          pip install -e ".[openai,anthropic]"
      - name: Sanity import
        working-directory: sdk/python
        run: python -c "import opentelm; print(opentelm.__name__)"

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      # Optional but recommended: protect with required reviewers in repo settings
      name: pypi
      url:  https://pypi.org/p/opentelm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches pyproject.toml version
        working-directory: sdk/python
        run: |
          PKG_VER="v$(python -c 'import tomllib,sys;print(tomllib.load(open(sys.argv[1],"rb"))["project"]["version"])' pyproject.toml)"
          TAG_VER="${GITHUB_REF_NAME#sdk-py-}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::tag $TAG_VER does not match pyproject.toml $PKG_VER"
            exit 1
          fi

      - name: Build sdist + wheel
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
