[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opentelm"
version = "0.1.0"
description = "Zero-config observability SDK for LLM apps. Auto-instruments OpenAI and Anthropic calls."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenTelLM" }]
keywords = ["llm", "observability", "openai", "anthropic", "monitoring", "tracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
openai    = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.25.0"]

[project.urls]
Homepage    = "https://github.com/yourorg/opentelm"
Repository  = "https://github.com/yourorg/opentelm"
Issues      = "https://github.com/yourorg/opentelm/issues"

[tool.setuptools.packages.find]
where   = ["."]
include = ["opentelm*"]
exclude = ["tests*"]
