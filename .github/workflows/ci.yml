name: CI

on:
  pull_request:
    branches: [main]
  # Also run on direct pushes to main as a safety net
  push:
    branches: [main]

# Cancel in-progress runs on the same branch when a new commit lands
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Python tests — isolation tests + fast stream-processor tests.
  # Slow tests (the @pytest.mark.slow ones with 75s waits) are left out
  # of CI; running docker compose in Actions is too flaky for them.
  # -------------------------------------------------------------------
  test-python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opentelm
          POSTGRES_PASSWORD: opentelm
          POSTGRES_DB: opentelm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opentelm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply Postgres schema
        env:
          PGPASSWORD: opentelm
        run: |
          sudo apt-get install -y postgresql-client
          psql -h localhost -U opentelm -d opentelm -f infra/postgres/schema.sql

      - name: Install service requirements + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ingest-api/requirements.txt
          pip install -r auth-service/requirements.txt
          pip install -r tests/requirements.txt

      - name: Start auth-service + ingest-api in background
        env:
          POSTGRES_DSN: postgresql://opentelm:opentelm@localhost:5432/opentelm
          REDIS_URL: redis://localhost:6379/0
          # CI-only secrets — non-sensitive
          JWT_SECRET_KEY: ci-jwt-secret-32-chars-of-padding-padding
          API_KEY_PEPPER: ci-pepper
          # Stub Kafka (the isolation tests don't actually verify Kafka payloads,
          # the ingest-api can't reach a broker — that's fine for these tests
          # because publish is the last step after auth/permission checks)
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: |
          (cd auth-service && uvicorn main:app --host 0.0.0.0 --port 8001) &
          (cd ingest-api  && uvicorn main:app --host 0.0.0.0 --port 8000) &
          # Wait for both health endpoints
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8001/health && curl -fsS http://localhost:8000/health && break
            sleep 1
          done

      - name: Run isolation tests
        env:
          AUTH_URL: http://localhost:8001
          INGEST_URL: http://localhost:8000
          TEST_POSTGRES_DSN: postgresql://opentelm:opentelm@localhost:5432/opentelm
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/test_isolation.py -v

      # The stream-processor tests need Kafka and ClickHouse, which we'd
      # need to spin up here. Skipping in CI — they're run nightly via the
      # @pytest.mark.slow exclusion locally. Documented in README.
      - name: Note on skipped tests
        run: |
          echo "test_stream_processor.py and test_dashboard.py require Kafka + ClickHouse + the dashboard image; they run locally against docker compose."

  # -------------------------------------------------------------------
  # Python SDK — runs against the real openai / anthropic packages with a
  # mocked HTTP transport. The matrix covers the newest releases on every
  # supported Python, plus the oldest SDK releases we claim to support.
  # -------------------------------------------------------------------
  test-python-sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.10", sdks: "latest" }
          - { python: "3.11", sdks: "latest" }
          - { python: "3.12", sdks: "latest" }
          - { python: "3.13", sdks: "latest" }
          - { python: "3.11", sdks: "oldest" }
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install SDK + test deps
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.sdks }}" = "oldest" ]; then
            pip install -e . pytest pytest-asyncio "openai==1.40.0" "anthropic==0.34.0" "httpx<0.28"
          else
            pip install -e ".[test]"
          fi
      - name: pytest
        run: python -m pytest -v

  # -------------------------------------------------------------------
  # Dashboard build + typecheck
  # -------------------------------------------------------------------
  test-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        # `npm ci` requires a lockfile; for first commits we fall back to install.
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        env:
          # Build-time env so next.config.ts compiles. These must be set or
          # the build fails on missing required vars.
          AUTH_SERVICE_URL: http://placeholder
          CLICKHOUSE_URL:   http://placeholder
          REDIS_URL:        redis://placeholder
          JWT_SECRET_KEY:   ci-jwt-secret-32-chars-of-padding-padding
          COOKIE_SECRET:    ci-cookie-secret-32-chars-of-padding
        run: npm run build

  # -------------------------------------------------------------------
  # Lint
  # -------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: ruff check
        run: ruff check .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: next lint
        working-directory: dashboard
        run: npm run lint || echo "lint not configured yet"
